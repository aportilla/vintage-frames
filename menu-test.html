<!doctype html>
<html lang="en">
  <!--
    Pixel-verification page for the horizontal menu/popup metrics — the
    companion to pixel-test.html, which covers the button silhouettes.

    Pins scale to 1 so one CSS px = one system px; screenshot at
    deviceScaleFactor 1 and measure with scripts/measure-menu-render.py
    (`npm run shot:menus` then `npm run measure:menus`). Every specimen uses
    the label "Menu item" so the leading glyph matches the reference sheets'
    pill and menu rows exactly, making the ink offsets directly comparable to
    the traced reference metrics (`npm run measure:menus` reduces this page the
    same way).

    Magenta background: it appears nowhere in the kit palette.
  -->
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --vf-scale: 1;
      }
      body {
        margin: 0;
        background: #f0f;
      }
      /* Absolute placement with wide gaps so each specimen rasterizes as its
         own island and the open panels can't overlap a neighbor. */
      .spec {
        position: absolute;
      }
      #pill {
        top: 20px;
        left: 20px;
      }
      #menu {
        top: 80px;
        left: 20px;
      }
      #popup {
        top: 20px;
        left: 320px;
      }
      #shortcuts {
        top: 260px;
        left: 320px;
      }
    </style>
    <script type="module" src="/src/index.ts"></script>
  </head>
  <body>
    <!-- Closed popup pill. Reference: border box 156×18, label ink at +16. -->
    <div class="spec" id="pill">
      <vf-select id="sel" value="a">
        <vf-option value="a">Menu item</vf-option>
      </vf-select>
    </div>

    <!-- Open pulldown with a checked row. Reference: ✓ ink at +4..12,
         label ink at +17, row pitch 16. These rows inherit the page's
         `:root { --vf-scale: 1 }`, which is the whole point of the fixture —
         see `npm run verify:scale`. -->
    <div class="spec" id="menu">
      <vf-menu label="File" open>
        <vf-menu-item checked>Menu item</vf-menu-item>
        <vf-menu-item>Menu item</vf-menu-item>
      </vf-menu>
    </div>

    <!-- The shortcut column, with the art's own File-menu strings (the one
         specimen that deliberately breaks the "Menu item" rule above, since
         the reference rows it is compared against are the File pulldown's).
         Reference: every shortcut's ⌘ ink starts 23px left of the right
         border, the letters ragged-right — ⌘W to within 3px of the border,
         ⌘I stopping 11 short — and the shortcut-less row keeps its 12px
         clearance. The separator spends a full 16px row (the MDEF's
         divider-as-item), so the ink pitch across it reads 32, not 16 — the
         gray dotted rule itself is invisible to the is_black reducer, exactly
         as the art's dithered rule is. -->
    <div class="spec" id="shortcuts">
      <vf-menu label="File" open>
        <vf-menu-item shortcut="⌘N">New Folder</vf-menu-item>
        <vf-menu-item shortcut="⌘W">Close Window</vf-menu-item>
        <vf-menu-item shortcut="⌘I">Get Info</vf-menu-item>
        <vf-separator></vf-separator>
        <vf-menu-item>Page Setup…</vf-menu-item>
      </vf-menu>
    </div>

    <!-- The same popup, opened, so vf-option rows can be measured. -->
    <div class="spec" id="popup">
      <vf-select id="sel2" value="a">
        <vf-option value="a">Menu item</vf-option>
        <vf-option value="b">Menu item</vf-option>
      </vf-select>
    </div>

    <script type="module">
      await customElements.whenDefined('vf-select')
      await customElements.whenDefined('vf-menu')
      await customElements.whenDefined('vf-option')
      await document.fonts.ready

      // vf-select.open is private @state, so the panel is opened the way a
      // user would rather than by poking the property.
      const sel2 = document.getElementById('sel2')
      await sel2.updateComplete
      sel2.shadowRoot.querySelector('.control').click()
      await sel2.updateComplete
    </script>
  </body>
</html>
